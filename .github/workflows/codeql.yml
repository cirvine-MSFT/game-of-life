name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 13 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - name: Provide placeholder UI dist so generate_context! succeeds
        run: |
          mkdir -p desktop/ui/dist
          echo "<!doctype html><title>codeql placeholder</title>" > desktop/ui/dist/index.html

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          queries: security-extended,security-and-quality

      - name: Build root crate
        run: cargo build --all-targets

      - name: Build desktop crate
        run: cargo build --manifest-path desktop/Cargo.toml --all-targets

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:rust"

  analyze-javascript-typescript:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
